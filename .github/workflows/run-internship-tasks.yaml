name: Execute All Internship Notebooks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Execute Task 1 Notebook
      run: |
        jupyter nbconvert --to notebook --execute "Task_1_Data_Understanding/Task_1.ipynb" --output-dir="./executed" || echo "Task 1 failed"

    - name: 🚀 Execute Task 2 Notebook
      run: |
        jupyter nbconvert --to notebook --execute "Task_2_Data_Cleaning/Task_2.ipynb" --output-dir="./executed" || echo "Task 2 failed"

    - name: 🚀 Execute Task 3 Notebook
      run: |
        jupyter nbconvert --to notebook --execute "Task_3_EDA/Task_3.ipynb" --output-dir="./executed" || echo "Task 3 failed"

    - name: 🚀 Execute Task 4 Notebook
      run: |
        jupyter nbconvert --to notebook --execute "Task_4_Segmentation/Task_4.ipynb" --output-dir="./executed" || echo "Task 4 failed"

    - name: 🚀 Execute Task 5 Notebook
      run: |
        jupyter nbconvert --to notebook --execute "Task_5_Advanced_Analysis/Task_5.ipynb" --output-dir="./executed" || echo "Task 5 failed"

    - name: 💾 Upload Executed Notebooks as Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: executed-notebooks
        path: executed/